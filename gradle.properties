# Global Gradle configuration for the Android multi-project
# Avoid failing builds when no tests are discovered (CI environment)
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.warning.mode=summary

# Disable failure on no discovered tests for all test tasks (Gradle 8+)
org.gradle.junit.test.discovery.failOnNoDiscoveredTests=false
